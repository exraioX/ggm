name: GODMODE CORE CI

on:
  push:
    branches:
      - llp
    paths:
      - "GODMODE-CORE/**"
      - ".github/workflows/core-ci.yml"
  pull_request:
    branches:
      - llp
    paths:
      - "GODMODE-CORE/**"
      - ".github/workflows/core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GODMODE-CORE
    steps:
      - name: Checkout llp
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: GODMODE-CORE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit and smoke tests
        run: npm test
