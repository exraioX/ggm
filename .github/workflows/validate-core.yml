name: Validate GODMODE CORE

on:
  push:
    branches: [claude, main]
    paths:
      - "GODMODE-CORE/**"
      - ".github/workflows/validate-core.yml"
  pull_request:
    branches: [claude, main]
    paths:
      - "GODMODE-CORE/**"
      - ".github/workflows/validate-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godmode-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: GODMODE-CORE/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix GODMODE-CORE

      - name: TypeScript typecheck
        run: npm run typecheck --prefix GODMODE-CORE

      - name: Automated test suite
        run: npm test --prefix GODMODE-CORE
